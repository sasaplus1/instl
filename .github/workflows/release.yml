name: release

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: |
          if [ "$(jq -r .version package.json)" != "$GITHUB_REF_NAME" ]
          then
            exit 1
          fi
  build:
    needs:
      - validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: '1.3.6'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:licenses
      - run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64
          do
            pnpm run build:binary:${target}
            mkdir -p dist/instl-${target}
            mv dist/instl dist/instl-${target}/instl
            cp LICENSE THIRD_PARTY_LICENSES.txt dist/instl-${target}/
            tar czvf dist/instl-${target}.tar.gz -C dist/instl-${target} .
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-binaries
          path: dist/*.tar.gz
          retention-days: 1
  publish:
    needs:
      - build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: package.json
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: '1.3.6'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:script
      # use npm for OIDC authentication (pnpm does not support OIDC yet)
      - run: npm install -g npm@11
      - run: pnpm publish --no-git-checks
  release:
    needs:
      - build
      - publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-binaries
          path: artifacts
      - run: |
          mkdir -p release-assets
          cp artifacts/*.tar.gz release-assets/
          cd release-assets
          sha256sum ./*.tar.gz > checksums.txt
      - run: gh release create '${{ github.ref_name }}' --title '${{ github.ref_name }}' --generate-notes release-assets/*
        env:
          GH_PROMPT_DISABLED: 1
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
