name: release

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: |
          if [ "$(jq -r .version package.json)" != "$GITHUB_REF_NAME" ]
          then
            exit 1
          fi
  build:
    name: build (${{ matrix.target }})
    needs:
      - validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            archive-name: instl-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            archive-name: instl-linux-arm64
          - os: macos-15
            target: darwin-arm64
            archive-name: instl-darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
            archive-name: instl-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: '1.3.6'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:binary
      - run: pnpm run generate:licenses
      - run: cp LICENSE dist/
      - run: tar czvf ${{ matrix.archive-name }}.tar.gz instl LICENSE THIRD_PARTY_LICENSES.txt
        working-directory: dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive-name }}
          path: dist/${{ matrix.archive-name }}.tar.gz
          retention-days: 1
  publish:
    needs:
      - build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: '1.3.6'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:script
      # use npm for OIDC authentication (pnpm does not support OIDC yet)
      - run: npm install -g npm@11
      - run: pnpm publish --no-git-checks
  release:
    needs:
      - build
      - publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - run: |
          mkdir -p release-assets
          for dir in artifacts/*/
          do
            cp "$dir"* release-assets/
          done
          cd release-assets
          sha256sum ./*.tar.gz > checksums.txt
      - run: gh release create '${{ github.ref_name }}' --title '${{ github.ref_name }}' --generate-notes release-assets/*
        env:
          GH_PROMPT_DISABLED: 1
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
